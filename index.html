<script>
// ─── NETWORK CANVAS ANIMATION ───
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H, nodes = [], edges = [];
const NODE_COUNT = 100;
const TEAL  = '#2dd4bf';
const AMBER = '#f59e0b';
const YELLOW = '#f7b801';
const PAPER = '#f4f0e8';

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function initNodes() {
  nodes = [];
  edges = [];
  for (let i = 0; i < NODE_COUNT; i++) {
    const isCentral = i < 7;
    nodes.push({
      x:       Math.random() * W,
      y:       Math.random() * H,
      vx:      (Math.random() - 0.5) * 0.2,
      vy:      (Math.random() - 0.5) * 0.2,
      r:       isCentral ? 5 + Math.random() * 4 : 2 + Math.random() * 2.5,
      color:   isCentral ? TEAL : (Math.random() < 0.30 ? AMBER : YELLOW),
      central: isCentral,
      pulse:   Math.random() * Math.PI * 2,
    });
  }
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const d = dist(nodes[i], nodes[j]);
      if (d < 500 && Math.random() < 1) {
        edges.push({ a: i, b: j, w: (1 - d / 220) * 0.5 });
      }
    }
  }
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function tick(t) {
  ctx.clearRect(0, 0, W, H);

  for (const e of edges) {
    const a = nodes[e.a], b = nodes[e.b];
    const d = dist(a, b);
    if (d > 220) continue;
    const alpha = e.w * (1 - d / 250) * 0.90;
    const isHighlight = a.central || b.central;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    const lightMode = document.documentElement.classList.contains('light');
    ctx.strokeStyle = isHighlight
      ? `rgba(13,148,136,${alpha * 2})`
      : lightMode
        ? `rgba(26,31,46,${alpha * 1.5})`
        : `rgba(244,240,232,${alpha * 2.5})`;
    ctx.lineWidth = isHighlight ? 1 : 0.5;
    ctx.stroke();
  }

  for (const n of nodes) {
    n.pulse += 0.02;
    const glow = n.central ? (1 + Math.sin(n.pulse) * 0.3) : 1;

    if (n.central) {
      const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 4 * glow);
      grad.addColorStop(0, 'rgba(45,212,191,0.25)');
      grad.addColorStop(1, 'rgba(45,212,191,0)');
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * 4 * glow, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r * glow, 0, Math.PI * 2);
    const lightMode = document.documentElement.classList.contains('light');
    const alpha = n.central ? 1.0 : 0.65;
    ctx.fillStyle = n.color === TEAL  ? `rgba(13,148,136,${alpha})`
                  : n.color === AMBER ? `rgba(245,158,11,${alpha})`
                  : lightMode
                    ? `rgba(26,31,46,${alpha * 0.75})`
                    : `rgba(244,240,232,${alpha * 0.75})`;
    ctx.fill();

    n.x += n.vx;
    n.y += n.vy;
    if (n.x < 0 || n.x > W) n.vx *= -1;
    if (n.y < 0 || n.y > H) n.vy *= -1;
  }

  requestAnimationFrame(tick);
}

// ─── STATE SYNC ───
const NP_STATE_KEY = 'npNetState';

function saveState() {
  try {
    sessionStorage.setItem(NP_STATE_KEY, JSON.stringify(
      nodes.map(n => ({ nx: n.x/W, ny: n.y/H, vx: n.vx, vy: n.vy,
                        color: n.color, central: n.central, r: n.r, pulse: n.pulse }))
    ));
  } catch(e) {}
}

function tryLoadState() {
  try {
    const raw = sessionStorage.getItem(NP_STATE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (!Array.isArray(saved) || !saved.length) return false;
    nodes = saved.map(s => ({
      x: s.nx * W, y: s.ny * H, vx: s.vx, vy: s.vy,
      color: s.color, central: s.central, r: s.r, pulse: s.pulse
    }));
    edges = [];
    for (let i = 0; i < nodes.length; i++)
      for (let j = i + 1; j < nodes.length; j++) {
        const d = dist(nodes[i], nodes[j]);
        if (d < 500) edges.push({ a: i, b: j, w: (1 - d / 220) * 0.5 });
      }
    return true;
  } catch(e) { return false; }
}

resize();
if (!tryLoadState()) initNodes();
window.addEventListener('resize', () => {
  const oldW = W, oldH = H;
  resize();
  nodes.forEach(n => { n.x = n.x / oldW * W; n.y = n.y / oldH * H; });
});
window.addEventListener('pagehide', saveState);
requestAnimationFrame(tick);

// ─── MOUSE INFLUENCE ───
document.addEventListener('mousemove', (e) => {
  for (const n of nodes) {
    const dx = e.clientX - n.x;
    const dy = e.clientY - n.y;
    const d  = Math.hypot(dx, dy);
    if (d < 120) {
      n.vx -= dx / d * 0.04;
      n.vy -= dy / d * 0.04;
    }
    const speed = Math.hypot(n.vx, n.vy);
    if (speed > 0.25) { n.vx *= 0.5; n.vy *= 0.5; }
  }
});

// ─── THEME TOGGLE ───
const themeToggle = document.getElementById('theme-toggle');
const themeIcon   = document.getElementById('theme-icon');
const themeLabel  = document.getElementById('theme-label');

function syncThemeButton() {
  const light = document.documentElement.classList.contains('light');
  themeIcon.textContent  = light ? '☾' : '☀';
  themeLabel.textContent = light ? 'Dark' : 'Light';
  return light;
}

let isLight = syncThemeButton();

window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    try {
      const saved = localStorage.getItem('npTheme');
      document.documentElement.classList.toggle('light', saved === 'light');
    } catch(e) {}
    isLight = syncThemeButton();
  }
});

themeToggle.addEventListener('click', () => {
  isLight = !isLight;
  document.documentElement.classList.toggle('light', isLight);
  syncThemeButton();
  try { localStorage.setItem('npTheme', isLight ? 'light' : 'dark'); } catch(e) {}
});
</script>
